<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BingePlay - Watch Party</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <!-- LEFT PANEL: Video Player & Controls -->
        <div class="video-section">
            <div class="room-header">
                <h1>BingePlay</h1>
                <div class="room-controls">
                    <input type="text" id="roomInput" placeholder="Enter Room...">
                    <button id="joinRoomBtn">Join Room</button>
                </div>
            </div>
            
            <p>Current Room: <span id="roomDisplay">None</span></p>

            <!-- Main Video Player -->
            <video id="videoPlayer" controls></video>

            <!-- URL & Local File Controls -->
            <div class="controls-row">
                <input type="text" id="videoUrlInput" placeholder="Paste .mp4 link here...">
                <button id="loadUrlBtn">Load URL</button>
                <button id="uploadBtn">Play Local</button>
                <input type="file" id="localFileInput" accept="video/mp4" style="display: none;">
            </div>
        </div>

        <!-- RIGHT PANEL: Sidebar (Cams & Chat) -->
        <div class="sidebar">
            <div class="cams">
                <h3>Face Cams</h3>
                <div id="video-grid">
                    <video id="myCam" autoplay playsinline></video>
                </div>
                
                <!-- Device Selection Dropdowns -->
                <div class="device-selectors" style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
                    <select id="cameraSelect" class="device-dropdown"></select>
                    <select id="micSelect" class="device-dropdown"></select>
                </div>
                
                <div class="cam-controls" style="display: flex; gap: 10px; margin-top: 12px;">
                    <button id="muteBtn" style="flex: 1;">Mute Mic</button>
                    <button id="screenShareBtn" style="flex: 1;">Share Screen</button>
                </div>
            </div>

            <div class="chat-container">
                <h3>Live Chat</h3>
                <div id="chatBox"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type a message...">
                    <button id="sendChatBtn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Socket.IO & PeerJS CDNs -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
