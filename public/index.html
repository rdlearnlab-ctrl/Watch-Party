<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BingePlay - Watch Party</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
</head>
<body>
    <!-- Firebase Auth Modal -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-modal">
            <h1>BINGEPLAY LOGIN</h1>
            <input type="email" id="emailInput" placeholder="Enter Email">
            <input type="password" id="passwordInput" placeholder="Enter Password">
            <div class="auth-buttons">
                <button id="loginBtn">Log In</button>
                <button id="signupBtn">Sign Up</button>
            </div>
            <button id="googleLoginBtn" class="google-btn" style="margin-top: 12px; width: 100%; background: #fef08a; color: #111827;">Log In with Google 🚀</button>
            <p id="authError" style="color: #f43f5e; display: none; font-weight: 600; margin-top: 10px;"></p>
        </div>
    </div>

    <div class="main-wrapper" id="mainApp" style="display: none;">
        
        <!-- LOBBY UI -->
        <div id="lobbySection" class="video-section" style="width: 100%; flex: 1; display: none;">
            <div class="room-header">
                <h1>BINGEPLAY LOBBY</h1>
                <div>
                    <button id="openProfileBtn" style="background: #a78bfa; color: #111827; margin-right: 12px;">👤 Profile</button>
                    <button id="logoutBtn" style="background: #f43f5e; color: white;">Log Out</button>
                </div>
            </div>
            <p>Welcome back, <span id="currentUserDisplay" style="font-weight:700;"></span>! Find a public watch party or host your own.</p>
            
            <div class="lobby-controls" style="display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;">
                <!-- Start Party Box -->
                <div style="flex: 1; background: #f9fafb; padding: 20px; border: 3px solid #111827; border-radius: 8px; box-shadow: 6px 6px 0px #111827;">
                    <h3>Start a Party</h3>
                    <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                        <input type="text" id="newRoomInput" placeholder="Room Name..." style="flex: 1; min-width: 140px;">
                        <select id="roomCategory" class="device-dropdown" style="width: auto;">
                            <option value="Movie Night">🎬 Movie Night</option>
                            <option value="Anime Binge">⚡ Anime Binge</option>
                            <option value="Study Session">📚 Study Session</option>
                            <option value="Just Chatting">💬 Just Chatting</option>
                        </select>
                        <select id="roomVisibility" class="device-dropdown" style="width: auto;">
                            <option value="public">Public</option>
                            <option value="private">Private</option>
                        </select>
                        <button id="createRoomBtn" style="background: #10b981; color: white;">Create</button>
                    </div>
                </div>
                
                <!-- Filter Rooms Box -->
                <div style="flex: 1; background: #f9fafb; padding: 20px; border: 3px solid #111827; border-radius: 8px; box-shadow: 6px 6px 0px #111827;">
                    <h3>Filter Lobbies</h3>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <select id="filterCategory" class="device-dropdown" style="flex: 1;">
                            <option value="all">🌐 All Categories</option>
                            <option value="Movie Night">🎬 Movie Night</option>
                            <option value="Anime Binge">⚡ Anime Binge</option>
                            <option value="Study Session">📚 Study Session</option>
                            <option value="Just Chatting">💬 Just Chatting</option>
                        </select>
                        <input type="text" id="joinPrivateRoomInput" placeholder="Private Code..." style="width: 130px;">
                        <button id="joinPrivateRoomBtn" style="background: #3b82f6; color: white;">Join</button>
                    </div>
                </div>
            </div>

            <h3>Active Public Rooms</h3>
            <div id="publicRoomsList" style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px; overflow-y: auto; max-height: 35vh;">
            </div>
        </div>

        <!-- ROOM UI -->
        <div id="roomSection" style="display: none; width: 100%; gap: 24px;">
            <div class="video-section">
                <div class="room-header">
                    <h1>BINGEPLAY</h1>
                    <div class="room-controls">
                        <button id="leaveRoomBtn" style="background: #f43f5e; color: white; margin-right: 12px;">Leave Room</button>
                    </div>
                </div>
                <p>Current Room: <span id="roomDisplay">None</span></p>
                
                <div class="video-wrapper">
                    <video id="videoPlayer" controls></video>
                    <div id="ytPlayer" style="display: none;"></div>
                    
                    <div id="whiteboardContainer" style="display: none;">
                        <div class="board-floating-tools">
                            <input type="color" id="colorPicker" value="#111827">
                            <button id="clearBoardBtn">Clear</button>
                        </div>
                        <canvas id="whiteboard"></canvas>
                    </div>

                    <div id="reaction-container"></div>
                </div>

                <div class="controls-row">
                    <input type="text" id="videoUrlInput" placeholder="Paste YouTube or .mp4 link here...">
                    <button id="loadUrlBtn">Load Video</button>
                    <button id="uploadBtn">Play Local</button>
                    <button id="openBoardBtn" style="background: #a78bfa; color: #111827;">Open Whiteboard</button>
                    <button id="theaterModeBtn" style="background: #1f2937; color: white;">🎬 Theater Mode</button>
                    <input type="file" id="localFileInput" accept="video/mp4,video/webm" style="display: none;">
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">
                <div class="cams">
                    <h3>Face Cams</h3>
                    <div id="video-grid">
                        <video id="myCam" autoplay playsinline muted></video>
                    </div>
                    
                    <select id="cameraSelect" class="device-dropdown" style="margin-top: 12px;"></select>
                    <select id="micSelect" class="device-dropdown" style="margin-top: 8px;"></select>
                    
                    <div class="cam-controls" style="margin-top: 12px;">
                        <button id="muteBtn">Mute Mic</button>
                        <button id="camToggleBtn">Disable Cam</button>
                    </div>
                    <div class="cam-controls" style="margin-top: 8px;">
                        <button id="screenShareBtn">Share Screen</button>
                        <button id="pttToggleBtn">PTT: OFF</button>
                    </div>
                    
                    <button id="holdToTalkBtn" style="display: none; width: 100%; margin-top: 12px; font-size: 18px; padding: 16px;">
                        🎙️ HOLD TO TALK
                    </button>
                    <p id="pttHint" style="font-size: 12px; margin-top: 6px; display: none; color: #4b5563; font-weight: 700;">
                        Desktop: Hold <kbd style="background:#111827; color:#fff; padding: 2px 6px; border-radius: 4px;">SPACE</kbd>
                    </p>
                </div>

                <div class="sidebar-tabs">
                    <button id="tabChatBtn" class="tab-btn active">Live Chat</button>
                    <button id="tabStudyBtn" class="tab-btn">Focus Timer</button>
                </div>

                <div id="chatSection" class="chat-container">
                    <div id="chatBox"></div>
                    
                    <div class="chat-input-area" style="margin-bottom: 8px;">
                        <button id="icebreakerBtn" style="background: #fef08a; color: #111827; font-size: 13px; padding: 8px 12px; width: 100%;">🎲 Roll Icebreaker</button>
                    </div>

                    <!-- REACTION BAR -->
                    <div class="reaction-bar">
                        <button class="reaction-btn" data-emoji="🔥">🔥</button>
                        <button class="reaction-btn" data-emoji="😂">😂</button>
                        <button class="reaction-btn" data-emoji="😲">😲</button>
                        <button class="reaction-btn" data-emoji="✏️">✏️</button>
                    </div>

                    <!-- NEW SOUNDBOARD SECTION -->
                    <div class="soundboard-bar">
                        <button class="sound-btn" data-sound="ding">🔔 Ding</button>
                        <button class="sound-btn" data-sound="crack">🦴 Crack</button>
                        <button class="sound-btn" data-sound="rizz">😏 Rizz</button>
                        <button class="sound-btn" data-sound="omg">😲 OMG</button>
                        <button class="sound-btn" data-sound="fahhh">😂 Fah</button>
                    </div>

                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Type a message...">
                        <button id="sendChatBtn">Send</button>
                    </div>
                </div>

                <div id="studySection" class="study-container" style="display: none;">
                    <div class="timer-section" style="border: none; padding: 0;">
                        <h3 style="margin-bottom: 8px;">Pomodoro</h3>
                        <div class="timer-display" id="timerDisplay">25:00</div>
                        <div class="timer-controls">
                            <button id="startTimerBtn">Start Sync</button>
                            <button id="resetTimerBtn">Reset</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="auth-overlay" style="display: none;">
        <div class="auth-modal">
            <h1>USER PROFILE</h1>
            <input type="text" id="profileBioInput" placeholder="Write a short bio...">
            <select id="profileGenreSelect" class="device-dropdown">
                <option value="Sci-Fi & Fantasy">Sci-Fi & Fantasy</option>
                <option value="Anime & Animation">Anime & Animation</option>
                <option value="Horror & Thriller">Horror & Thriller</option>
                <option value="Comedy & Action">Comedy & Action</option>
            </select>
            <div class="auth-buttons">
                <button id="saveProfileBtn" style="background: #10b981; color: white;">Save Profile</button>
                <button id="closeProfileBtn" style="background: #f43f5e; color: white;">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
